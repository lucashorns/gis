    mapboxgl.accessToken = 'pk.eyJ1IjoibHVjYXNob3JucyIsImEiOiJjbTZ6ZGtweWMwM2RzMnFvbWJ2NGVoNjU1In0.dU3kPMeYYDdlAowT1VonWQ';

  // Google Sheet URL for parking complaints (direct access for faster loading)
  const parkingComplaintsCSVURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRuzt5Ipy8TSS2FMV5zcoO-UGpBTM-zQiJ3gQQ8y6zl7ktmzqw2Cl-zTZsq8CuJe7jiQRpDkAo_QLRw/pub?output=csv&gid=669627849';

  // Function to load parking complaints data
  function loadParkingComplaints() {
    console.log('Loading parking complaints from:', parkingComplaintsCSVURL);
    
    // Use fetch with timeout for faster loading
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 second timeout
    
    fetch(parkingComplaintsCSVURL, {
      signal: controller.signal,
      cache: 'no-cache' // Force fresh data
    })
    .then(response => {
      clearTimeout(timeoutId);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      return response.text();
    })
    .then(csvText => {
      Papa.parse(csvText, {
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true, // Skip empty rows for faster processing
        complete: function(results) {
          console.log("Parking complaints data loaded:", results.data.length, "rows");
          window.parkingComplaintsData = results.data;
          
          // Update the parking complaints layer if it exists
          if (map.getSource('parking-complaints')) {
            updateParkingComplaintsLayer();
          } else {
            console.log('Parking complaints source not yet available');
          }
        },
        error: function(error) {
          console.error("Error parsing CSV:", error);
        }
      });
    })
    .catch(error => {
      clearTimeout(timeoutId);
      console.error("Error fetching parking complaints CSV:", error);
      
      // Fallback to Papa Parse if fetch fails
      Papa.parse(parkingComplaintsCSVURL, {
        download: true,
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        complete: function(results) {
          window.parkingComplaintsData = results.data;
          if (map.getSource('parking-complaints')) {
            updateParkingComplaintsLayer();
          }
        },
        error: function(error) {
          console.error("Fallback error:", error);
        }
      });
    });
  }

  // Function to update parking complaints layer
  function updateParkingComplaintsLayer() {
    if (!window.parkingComplaintsData || !map.getSource('parking-complaints')) {
      console.log('No parking complaints data or source available');
      return;
    }

    console.log('Raw parking complaints data:', window.parkingComplaintsData);
    
    // Check what columns are available
    if (window.parkingComplaintsData.length > 0) {
      console.log('Available columns:', Object.keys(window.parkingComplaintsData[0]));
    }

    // Try multiple possible column name variations for coordinates
    const features = window.parkingComplaintsData
      .filter(row => {
        // Check for various possible column names
        const lat = row.Latitude || row.latitude || row.LAT || row.lat || row.Lat;
        const lng = row.Longitude || row.longitude || row.LNG || row.lng || row.Lng || row.Lon || row.lon;
        
        console.log('Row coordinates check:', { lat, lng, row });
        
        return lat && lng && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng));
      })
      .map(row => {
        // Get coordinates with fallback column names
        const lat = row.Latitude || row.latitude || row.LAT || row.lat || row.Lat;
        const lng = row.Longitude || row.longitude || row.LNG || row.lng || row.Lng || row.Lon || row.lon;
        
        return {
          type: 'Feature',
          geometry: {
            type: 'Point',
            coordinates: [parseFloat(lng), parseFloat(lat)]
          },
          properties: {
            id: row.id || row.ID || Math.random().toString(36).substr(2, 9),
            name: row.Name || row.name || row.NAME || 'No name provided',
            address: row.Address || row.address || row.ADDRESS || 'No address provided',
            description: row.Description || row.description || row.DESC || 'No description provided',
            date: row.Date || row.date || row.DATE || 'No date provided',
            status: row.Status || row.status || row.STATUS || 'Unknown',
            type: row.Type || row.type || row.TYPE || 'Complaint'
          }
        };
      });

    console.log('Filtered features:', features);

    const geojson = {
      type: 'FeatureCollection',
      features: features
    };

    map.getSource('parking-complaints').setData(geojson);
    console.log(`Updated parking complaints layer with ${features.length} points`);
  }

  // Load parking complaints data initially with a small delay to prioritize map loading
  setTimeout(loadParkingComplaints, 1000);

  // Set up auto-refresh every 5 minutes
  setInterval(loadParkingComplaints, 5 * 60 * 1000);

  // Original project data loading (keeping for compatibility)
  const googleSheetCSVURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRZToqFchm73U9DIhOr9TsgSTSvfveG59DBh4mXZATKs3UKj4e7yLiE-Ai7V2nMrlZivZZg7cvBUPWr/pub?gid=0&single=true&output=csv';

  Papa.parse(googleSheetCSVURL, {
    download: true,
    header: true,
    dynamicTyping: true,
    complete: function(results) {
      window.projectData = results.data;
      console.log("Data loaded from Google Sheet (Papa Parse):", window.projectData);
    },
    error: function(error) {
      console.error("Error fetching or parsing CSV:", error);
    }
  });

                console.log('Complaint pin PNG loaded successfully');
                
                map.addLayer({
                    'id': 'parking-complaints',
                    'type': 'symbol',
                    'source': 'parking-complaints',
                    'layout': {
                        'visibility': 'visible',
                        'icon-image': 'complaint-pin',
                        'icon-size': [
                            'interpolate',
                            ['linear'],
                            ['zoom'],
                            12, 0.5,
                            16, 0.8
                        ],
                        'icon-allow-overlap': true,
                        'icon-anchor': 'bottom'
                    },
                    'paint': {
                        'icon-color': [
                            'case',
                            ['==', ['get', 'status'], 'Completed'], '#00FF00',
                            ['==', ['get', 'status'], 'Active'], '#FFFF00',
                            '#FF1493'
                        ],
                        'icon-opacity': 0.9
                    }
                });
                console.log('Parking complaints symbol layer created with pin icon');
            }
        });

        // Add popup for parking complaints
        map.on('click', 'parking-complaints', (e) => {
            const coordinates = e.features[0].geometry.coordinates.slice();
            const properties = e.features[0].properties;
            
            const popupContent = `
                <div style="font-family: Arial, sans-serif; max-width: 300px;">
                    <p>${properties.name}</p>
                </div>
            `;
            
            new mapboxgl.Popup()
                .setLngLat(coordinates)
                .setHTML(popupContent)
                .addTo(map);
        });

        // Change cursor to pointer when hovering over parking complaints
        map.on('mouseenter', 'parking-complaints', () => {
            map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', 'parking-complaints', () => {
            map.getCanvas().style.cursor = '';
        });

        // Initialize parking complaints layer after map loads
        setTimeout(() => {
            console.log('Checking for parking complaints data after map load...');
            if (window.parkingComplaintsData) {
                updateParkingComplaintsLayer();
            } else {
                console.log('No parking complaints data available, loading now...');
                loadParkingComplaints();
            }
        }, 500);
    });
    
    // Set up legend toggle functionality using event delegation
    function setupLegendToggles() {
        // Use event delegation on the legend container
        const legend = document.getElementById('legend');
        
        if (!legend) {
            console.error('Legend element not found');
            return;
        }

        // Remove any existing event listeners by cloning the legend
        const newLegend = legend.cloneNode(true);
        legend.parentNode.replaceChild(newLegend, legend);

        // Add event listener to the legend container using event delegation
        newLegend.addEventListener('click', function(e) {
            // Check if the clicked element is a toggle button
            if (e.target.classList.contains('legend-toggle')) {
                e.preventDefault();
                e.stopPropagation();
                
                const layerId = e.target.getAttribute('data-layer');
                console.log('Toggle clicked for layer:', layerId);
                
                if (!layerId) {
                    console.error('No layer ID found for toggle');
                    return;
                }
                
                try {
                    const visibility = map.getLayoutProperty(layerId, 'visibility');
                    console.log('Current visibility:', visibility);

                    if (visibility === 'visible') {
                        // Hide layer
                        map.setLayoutProperty(layerId, 'visibility', 'none');
                        e.target.classList.remove('active');
                        console.log('Layer hidden:', layerId);
                        
                        // Hide synchronized layers
                        if (layerId === 'Hydrant_No_Parking') {
                            map.setLayoutProperty('Water-Hydrants', 'visibility', 'none');
                            console.log('Water-Hydrants hidden');
                        }
                        
                        if (layerId === 'Sign_No_Parking') {
                            map.setLayoutProperty('NP_Signs', 'visibility', 'none');
                            console.log('NP_Signs hidden');
                        }
                        
                        if (layerId === 'parking-complaints') {
                            console.log('Parking complaints hidden');
                        }
                    } else {
                        // Show layer
                        map.setLayoutProperty(layerId, 'visibility', 'visible');
                        e.target.classList.add('active');
                        console.log('Layer shown:', layerId);
                        
                        // Show synchronized layers
                        if (layerId === 'Hydrant_No_Parking') {
                            map.setLayoutProperty('Water-Hydrants', 'visibility', 'visible');
                            console.log('Water-Hydrants shown');
                        }
                        
                        if (layerId === 'Sign_No_Parking') {
                            map.setLayoutProperty('NP_Signs', 'visibility', 'visible');
                            console.log('NP_Signs shown');
                        }
                        
                        if (layerId === 'parking-complaints') {
                            console.log('Parking complaints shown');
                        }
                    }
                } catch (error) {
                    console.error('Error toggling layer:', layerId, error);
                }
            }
        });

        // Ensure synchronized layers are set up on initial load
        const toggles = newLegend.querySelectorAll('.legend-toggle');
        toggles.forEach(toggle => {
            const layerId = toggle.getAttribute('data-layer');
            
            if (layerId === 'Hydrant_No_Parking') {
                const hydrantVisibility = map.getLayoutProperty('Hydrant_No_Parking', 'visibility');
                map.setLayoutProperty('Water-Hydrants', 'visibility', hydrantVisibility);
            }
            
            if (layerId === 'Sign_No_Parking') {
                const signVisibility = map.getLayoutProperty('Sign_No_Parking', 'visibility');
                map.setLayoutProperty('NP_Signs', 'visibility', signVisibility);
            }
        });

        // Satellite toggle functionality
        const satelliteToggle = document.getElementById('satellite-toggle');
        console.log('Satellite toggle found:', satelliteToggle);
        if (satelliteToggle) {
            // Remove any existing event listeners
            const newSatelliteToggle = satelliteToggle.cloneNode(true);
            satelliteToggle.parentNode.replaceChild(newSatelliteToggle, satelliteToggle);
            
            newSatelliteToggle.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                const currentVisibility = map.getLayoutProperty('satellite-layer', 'visibility');
                const isActive = newSatelliteToggle.classList.contains('active');
                
                console.log('Satellite toggle clicked. Current visibility:', currentVisibility, 'Is active:', isActive);
                
                if (currentVisibility === 'visible' || isActive) {
                    // Hide satellite
                    map.setLayoutProperty('satellite-layer', 'visibility', 'none');
                    newSatelliteToggle.classList.remove('active');
                    console.log('Satellite hidden');
                } else {
                    // Show satellite
                    map.setLayoutProperty('satellite-layer', 'visibility', 'visible');
                    newSatelliteToggle.classList.add('active');
                    console.log('Satellite shown');
                }
            });
        }


    }

    // Set up legend toggles when DOM is ready
    function initializeLegend() {
        // Wait a bit to ensure DOM is fully ready
        setTimeout(() => {
            setupLegendToggles();
        }, 100);
    }

    // After the last frame rendered before the map enters an "idle" state.
    map.on('idle', () => {
        // If these layers were not added to the map, abort
        if (!map.getLayer('Sign_No_Parking') || !map.getLayer('Hydrant_No_Parking') || !map.getLayer('Water-Hydrants') || !map.getLayer('NP_Signs') || !map.getLayer('Crosswalks') || !map.getLayer('parking-complaints')) {
            return;
        }

        // Initialize legend toggles
        initializeLegend();
    });

    // Also try to set up legend when the page loads
    document.addEventListener('DOMContentLoaded', () => {
        // Wait for map to be ready
        if (map.loaded()) {
            initializeLegend();
        } else {
            map.once('load', () => {
                setTimeout(initializeLegend, 500);
            });
        }
    });
</script>
